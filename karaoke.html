<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Karaoke — 18 de Tomas</title>
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --void: #04060F; --void2: #090D1A; --void3: #111828; --void4: #1C2438;
  --colour: #7B2FBE; --colour-bright: #B44FE8;
  --star: #C4A882; --star-bright: #DFC49A; --parchment: #E8DCC8; --text-muted: #7A6E60; --red: #C0392B;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--void); color: var(--parchment); font-family: 'Jost', sans-serif; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  background: linear-gradient(to bottom, rgba(4,6,15,0.97), transparent);
}
.nav-back { color: var(--parchment); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
.nav-back:hover { color: var(--star); }
.nav-tools { display: flex; gap: 0.5rem; }
.icon-btn {
  background: transparent; border: 1px solid rgba(196,168,130,0.25); color: var(--text-muted);
  padding: 0.4rem 0.8rem; font-size: 0.72rem; cursor: pointer; font-family: 'Jost', sans-serif;
  letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.2s;
}
.icon-btn:hover, .icon-btn.on { border-color: var(--star); color: var(--star); }

main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 6rem 1.25rem 3rem; }
.hero { text-align: center; margin-bottom: 2rem; }
.tag { font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--star); display: block; margin-bottom: 0.5rem; }
h1 { font-family: 'New Rocker', system-ui; font-size: clamp(2.2rem, 7vw, 3.8rem); margin-bottom: 0.6rem; }
.sub { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; max-width: 460px; margin: 0 auto; }

/* Ahora canta */
.now {
  text-align: center; padding: 2rem 1.25rem; margin-bottom: 1.5rem;
  background: linear-gradient(135deg, rgba(123,47,190,0.18), rgba(9,13,26,0.9));
  border: 1px solid var(--colour-bright); box-shadow: 0 0 40px rgba(180,79,232,0.15);
}
.now-label { font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--star); }
.now-name { font-family: 'New Rocker', system-ui; font-size: clamp(1.8rem, 6vw, 3rem); color: var(--colour-bright); margin: 0.5rem 0 0.25rem; word-break: break-word; }
.now-song { font-size: clamp(1.1rem, 3.5vw, 1.6rem); color: var(--parchment); word-break: break-word; }
.now-empty { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.75rem; }
.now-actions { margin-top: 1.25rem; display: none; }
body.host .now-actions { display: block; }

/* Anotarse */
.signup-wrap { position: relative; margin-bottom: 2rem; }
.signup { background: var(--void2); border: 1px solid rgba(196,168,130,0.15); padding: 1.25rem; display: grid; gap: 0.75rem; }
.signup label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--star); display: block; margin-bottom: 0.3rem; }
.field {
  width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(196,168,130,0.2);
  color: var(--parchment); font-family: 'Jost', sans-serif; font-size: 1rem; outline: none; transition: border-color 0.2s;
}
.field:focus { border-color: var(--star); }
.btn {
  padding: 0.9rem 1.5rem; background: linear-gradient(135deg, var(--colour), var(--colour-bright)); border: none; color: #fff;
  font-family: 'New Rocker', system-ui; font-size: 1.1rem; letter-spacing: 0.08em; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
}
.btn:hover:not(:disabled) { transform: scale(1.02); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.small { font-family: 'Jost', sans-serif; font-size: 0.8rem; padding: 0.6rem 1.2rem; letter-spacing: 0.1em; text-transform: uppercase; }

/* Candado (borrá este bloque CSS y el bloque HTML del candado para habilitar anotarse) */
.signup-lock {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem;
  background: rgba(4,6,15,0.85); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  border: 1px dashed rgba(196,168,130,0.35); text-align: center; padding: 1rem; cursor: not-allowed;
}
.signup-lock-icon { font-size: 2.2rem; }
.signup-lock-title { font-family: 'New Rocker', system-ui; font-size: 1.1rem; color: var(--star); }
.signup-lock-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }

/* Cola */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.75rem; }
.section-head h2 { font-family: 'New Rocker', system-ui; font-size: 1.3rem; color: var(--star); }
.count { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.08em; }
.queue { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
.item { display: flex; align-items: center; gap: 0.9rem; padding: 0.8rem 1rem; background: var(--void2); border: 1px solid rgba(196,168,130,0.1); }
.item.mine { border-color: rgba(180,79,232,0.5); }
.pos { font-family: 'New Rocker', system-ui; font-size: 1.3rem; color: var(--star); opacity: 0.6; min-width: 30px; text-align: center; }
.info { flex: 1; min-width: 0; }
.who { font-size: 1rem; color: var(--parchment); word-break: break-word; }
.what { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.1rem; word-break: break-word; }
.badge { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--colour-bright); margin-left: 0.4rem; }
.del { background: transparent; border: 1px solid rgba(192,57,43,0.4); color: var(--red); width: 34px; height: 34px; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; display: none; }
.del:hover { background: rgba(192,57,43,0.12); }
.item.mine .del, body.host .del { display: block; }
.empty { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 2rem 1rem; border: 1px dashed rgba(196,168,130,0.15); }
details.done { margin-bottom: 2rem; }
details.done summary { cursor: pointer; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.6rem; }
details.done .item { opacity: 0.55; }

/* Modo proyector */
.tv-url { display: none; }
body.tv nav .nav-back, body.tv #btn-host { display: none; }
body.tv .hero, body.tv .signup-wrap, body.tv details.done { display: none; }
body.tv main { max-width: 1100px; padding-top: 4.5rem; }
body.tv .now { padding: 3rem 2rem; }
body.tv .now-label { font-size: 1.1rem; }
body.tv .now-name { font-size: clamp(3rem, 8vw, 6rem); }
body.tv .now-song { font-size: clamp(1.8rem, 4vw, 3rem); }
body.tv .item { padding: 1.1rem 1.5rem; }
body.tv .who { font-size: 1.7rem; }
body.tv .what { font-size: 1.2rem; }
body.tv .pos { font-size: 2rem; min-width: 50px; }
body.tv .section-head h2 { font-size: 1.8rem; }
body.tv .tv-url { display: block; text-align: center; color: var(--star); font-size: 1.1rem; letter-spacing: 0.05em; margin-top: 1.5rem; word-break: break-all; }
body.tv .del { display: none !important; }
body.tv .badge { display: none; }
body.tv .item.mine { border-color: rgba(196,168,130,0.1); }
body.tv .now-actions { display: none !important; }

.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translate(-50%, 100px); background: var(--void3); border: 1px solid var(--colour-bright);
  color: var(--parchment); padding: 0.8rem 1.4rem; font-size: 0.85rem; z-index: 999; opacity: 0; transition: all 0.4s ease; max-width: 90vw; text-align: center;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 600px) {
  nav {
    flex-wrap: wrap;
    padding: 0.6rem 1rem;
    gap: 0.4rem;
  }
  .nav-back { font-size: 0.75rem; }
  .nav-tools { width: 100%; justify-content: flex-end; }
  .icon-btn { font-size: 0.65rem; padding: 0.3rem 0.5rem; }
  #btn-full { display: none; }
  main { padding: 7rem 1rem 2.5rem; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav>
  <a href="index.html" class="nav-back">← Volver</a>
  <div class="nav-tools">
    <button class="icon-btn" id="btn-host">🔑 Anfitrión</button>
    <button class="icon-btn" id="btn-tv">📺 Modo proyector</button>
    <button class="icon-btn" id="btn-full">⛶</button>
  </div>
</nav>

<main>
  <div class="hero">
    <span class="tag">Micrófono abierto</span>
    <h1>Karaoke</h1>
    <p class="sub">Anotate con tu nombre y la canción que querés cantar. La lista se ve en vivo en la pantalla.</p>
  </div>

  <div class="now" id="now"></div>

  <div class="signup-wrap">
    <!-- ===== 🔒 CANDADO: borrá o comentá desde acá hasta "FIN CANDADO" para habilitar anotarse ===== --> 
    <div class="signup-lock" id="signup-lock">
      <div class="signup-lock-icon">🔒</div>
      <div class="signup-lock-title">Anotarse está bloqueado</div>
      <div class="signup-lock-text">Se habilita el día de la fiesta.</div>
    </div>
    <!-- ===== FIN CANDADO ===== --> 
    <div class="signup">
      <div>
        <label for="in-name">Tu nombre</label>
        <input class="field" id="in-name" maxlength="30" placeholder="Ej: Juan" autocomplete="given-name">
      </div>
      <div>
        <label for="in-song">Canción (y artista)</label>
        <input class="field" id="in-song" maxlength="70" placeholder="Ej: Bohemian Rhapsody - Queen">
      </div>
      <button class="btn" id="btn-add">Anotarme 🎤</button>
    </div>
  </div>

  <div class="section-head"><h2>En cola</h2><span class="count" id="count"></span></div>
  <div class="queue" id="queue"></div>

  <details class="done" id="done-wrap" style="display:none">
    <summary id="done-summary">Ya cantaron</summary>
    <div class="queue" id="done-list"></div>
  </details>

  <p class="tv-url" id="tv-url"></p>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "./demo-firebase.js";
import { getDatabase, ref, push, onValue, update, remove, serverTimestamp }
  from "./demo-firebase.js";
import { getAuth, signInAnonymously }
  from "./demo-firebase.js";

// ── CONFIG ──
const FIREBASE_CONFIG = {
  apiKey: "DEMO",
  authDomain: "DEMO",
  databaseURL: "DEMO",
  projectId: "DEMO",
  storageBucket: "DEMO",
  messagingSenderId: "DEMO",
  appId: "DEMO"
};
const HOST_PIN = '0000';      // ← cambiá este PIN (es el que abre el modo Anfitrión)
const MAX_ACTIVE = 2;         // cuántas canciones puede tener anotadas cada persona a la vez

const $ = id => document.getElementById(id);
const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);
const auth = getAuth(app);
let myUid = null;
let entries = {};

function safeGet(s, k) { try { return s.getItem(k); } catch { return null; } }
function safeSet(s, k, v) { try { s.setItem(k, v); } catch {} }

const authReady = signInAnonymously(auth).then(c => { myUid = c.user.uid; }).catch(err => {
  console.error(err);
  toast('No se pudo iniciar sesión. Revisá que "Anónimo" esté activado en Firebase');
});

// ── REALTIME ──
authReady.then(() => {
  onValue(ref(db, 'karaoke'), snap => {
    entries = snap.val() || {};
    render();
  }, err => {
    console.error(err);
    toast('No se puede leer la lista. Revisá las reglas de la base de datos');
  });
});

function sorted(list) {
  return list.sort((a, b) => (a[1].createdAt || Date.now()) - (b[1].createdAt || Date.now()));
}

function render() {
  const all = Object.entries(entries);
  const queued = sorted(all.filter(([, e]) => e.status !== 'done'));
  const done = sorted(all.filter(([, e]) => e.status === 'done')).reverse();
  const current = queued[0];
  const rest = queued.slice(1);

  // Ahora canta
  const now = $('now');
  if (current) {
    now.innerHTML = `
      <div class="now-label">🎤 Ahora canta</div>
      <div class="now-name">${esc(current[1].name)}</div>
      <div class="now-song">${esc(current[1].song)}</div>
      <div class="now-actions"><button class="btn small" id="btn-next" data-id="${current[0]}">✓ Terminó, siguiente</button></div>`;
  } else {
    now.innerHTML = `<div class="now-label">🎤 Escenario libre</div><div class="now-empty">Nadie anotado todavía. ¡Sé el primero!</div>`;
  }

  // Cola
  $('count').textContent = rest.length ? `${rest.length} esperando` : '';
  $('queue').innerHTML = rest.length
    ? rest.map(([id, e], i) => itemHtml(id, e, i + 1)).join('')
    : `<div class="empty">${current ? 'No hay nadie más en la cola' : 'La cola está vacía'}</div>`;

  // Ya cantaron
  $('done-wrap').style.display = done.length ? '' : 'none';
  $('done-summary').textContent = `Ya cantaron (${done.length})`;
  $('done-list').innerHTML = done.map(([id, e]) => itemHtml(id, e, '✓')).join('');
}

function itemHtml(id, e, pos) {
  const mine = e.uid && e.uid === myUid;
  return `
    <div class="item ${mine ? 'mine' : ''}">
      <span class="pos">${pos}</span>
      <div class="info">
        <div class="who">${esc(e.name)}${mine ? '<span class="badge">vos</span>' : ''}</div>
        <div class="what">${esc(e.song)}</div>
      </div>
      <button class="del" data-del="${id}" title="Quitar">✕</button>
    </div>`;
}

// ── ANOTARSE ──
async function addEntry() {
  if ($('signup-lock')) { toast('Anotarse está bloqueado por ahora 🔒'); return; }
  const name = $('in-name').value.trim();
  const song = $('in-song').value.trim();
  if (!name || !song) { toast('Completá tu nombre y la canción 📝'); return; }
  await authReady;
  if (!myUid) return;

  const active = Object.values(entries).filter(e => e.uid === myUid && e.status !== 'done').length;
  if (active >= MAX_ACTIVE) { toast(`Ya tenés ${MAX_ACTIVE} canciones en la cola. Esperá a que canten 🙂`); return; }

  $('btn-add').disabled = true;
  try {
    await push(ref(db, 'karaoke'), { name, song, uid: myUid, status: 'queued', createdAt: serverTimestamp() });
    safeSet(localStorage, 'karaoke_name', name);
    $('in-song').value = '';
    toast('¡Anotado! 🎶');
  } catch (err) {
    console.error(err);
    toast('No se pudo anotar. Probá de nuevo');
  }
  $('btn-add').disabled = false;
}
$('btn-add').onclick = addEntry;
$('in-song').addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
$('in-name').value = safeGet(localStorage, 'karaoke_name') || '';

// ── ACCIONES (quitar / siguiente) ──
document.addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('¿Quitar esta canción de la lista?')) return;
    remove(ref(db, `karaoke/${del.dataset.del}`)).catch(() => toast('No se pudo quitar'));
    return;
  }
  const next = e.target.closest('#btn-next');
  if (next) {
    update(ref(db, `karaoke/${next.dataset.id}`), { status: 'done', doneAt: serverTimestamp() })
      .catch(() => toast('No se pudo avanzar'));
  }
});

// ── MODO ANFITRIÓN ──
function setHost(on) {
  document.body.classList.toggle('host', on);
  $('btn-host').classList.toggle('on', on);
  $('btn-host').textContent = on ? '🔑 Anfitrión ✓' : '🔑 Anfitrión';
}
$('btn-host').onclick = () => {
  if (document.body.classList.contains('host')) { setHost(false); safeSet(sessionStorage, 'karaoke_host', '0'); return; }
  const pin = prompt('PIN de anfitrión:');
  if (pin === null) return;
  if (pin === HOST_PIN) { setHost(true); safeSet(sessionStorage, 'karaoke_host', '1'); toast('Modo anfitrión activado'); }
  else toast('PIN incorrecto');
};
if (safeGet(sessionStorage, 'karaoke_host') === '1') setHost(true);

// ── MODO PROYECTOR ──
function setTv(on) {
  document.body.classList.toggle('tv', on);
  $('btn-tv').classList.toggle('on', on);
  $('btn-tv').textContent = on ? '✕ Salir del modo proyector' : '📺 Modo proyector';
  $('tv-url').textContent = '📱 Anotate desde tu celu: ' + location.href.split('#')[0];
}
$('btn-tv').onclick = () => setTv(!document.body.classList.contains('tv'));
$('btn-full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

// ── UTILIDADES ──
function esc(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

// ── FONDO DE ESTRELLAS ──
const bg = $('bg-canvas'), bctx = bg.getContext('2d');
let W, H, stars = [], fr = 0;
function resize() { W = bg.width = innerWidth; H = bg.height = innerHeight; }
resize(); addEventListener('resize', resize);
for (let i = 0; i < 80; i++) stars.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, s: Math.random() + 0.3, a: Math.random() * 0.4 + 0.1, sp: Math.random() * 0.02 + 0.005, o: Math.random() * 6.28 });
(function loop() {
  bctx.clearRect(0, 0, W, H); fr++;
  stars.forEach(p => { bctx.globalAlpha = Math.max(0, p.a + Math.sin(fr * p.sp + p.o) * 0.1); bctx.fillStyle = '#fff'; bctx.beginPath(); bctx.arc(p.x, p.y, p.s, 0, 6.28); bctx.fill(); });
  requestAnimationFrame(loop);
})();

render();
</script>
<div style="position:fixed;left:.6rem;bottom:calc(.6rem + env(safe-area-inset-bottom,0px));z-index:9999;padding:.3rem .7rem;background:rgba(0,0,0,.75);border:1px solid rgba(196,168,130,.35);color:#C4A882;font:400 12px system-ui,sans-serif;pointer-events:none">Versión demo · datos de ejemplo</div>
</body>
</html>
